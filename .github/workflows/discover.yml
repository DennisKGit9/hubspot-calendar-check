name: discover-endpoint

on:
  workflow_dispatch:
  push:
    branches: ["claude/hubspot-google-calendar-sync-iszjay"]
    paths: ["tools/discover.py", ".github/workflows/discover.yml"]

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python tools/discover.py
