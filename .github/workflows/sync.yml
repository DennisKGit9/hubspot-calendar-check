name: hubspot-busy-ics

on:
  schedule:
    # Twice daily for resilience against GitHub Actions' scheduling delays
    # (each run rebuilds against whatever is actually booked *at run time*,
    # so the exact time a run lands no longer matters). Minutes are off
    # :00 on purpose: GitHub's scheduler queue is most congested at the top
    # of the hour, which is what caused runs to land hours late and get
    # silently skipped.
    - cron: "13 8 * * *"
    - cron: "47 17 * * *"
  workflow_dispatch: {}

# Need write access to push the generated feed to the gh-pages branch.
permissions:
  contents: write

# Never run two publishes at once; never cancel an in-progress one.
concurrency:
  group: publish-busy-ics
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build busy.ics
        id: build
        run: |
          # Always build: compute_busy() already drops anything before the
          # actual wall-clock time at run time, so there's no need to gate
          # this on the schedule having fired at a particular hour (an
          # earlier exact-hour time guard made every run a no-op once
          # GitHub started delivering scheduled runs hours late).
          python -m src.main --once
          if [ -f output/busy.ics ]; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
            echo "::error::src.main did not produce output/busy.ics"
            exit 1
          fi

      # Publish the feed to the gh-pages branch via git (no Actions artifact
      # storage involved, so this is unaffected by the artifact storage quota).
      - name: Publish feed to gh-pages
        if: steps.build.outputs.built == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cp output/busy.ics "$work/busy.ics"
          cat > "$work/index.html" <<'HTML'
          <!doctype html><meta charset="utf-8"><title>HubSpot Busy feed</title>
          <body style="font-family:system-ui;max-width:40rem;margin:4rem auto">
          <h1>HubSpot Busy feed</h1>
          <p>Subscribe to <a href="busy.ics">busy.ics</a> in your calendar app
          (Google Calendar: <em>Other calendars &rarr; From URL</em>).</p>
          </body>
          HTML
          cd "$work"
          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Publish busy.ics ($(date -u +%FT%TZ))"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "Published to gh-pages."
